[project]
name = "aws-scanner"
version = "0.1.0"
description = "AWS Cloud Security Scanner for Misconfigurations (CSSM)"
dependencies = [
    "boto3==1.39.3",
    "botocore==1.39.3",
    "iniconfig==2.1.0",
    "Jinja2==3.1.6",
    "jmespath==1.0.1",
    "MarkupSafe==3.0.2",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==8.4.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.1",
    "s3transfer==0.13.0",
    "six==1.17.0",
    "urllib3==2.5.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aws-scanner = "aws_scanner.cli.main:main"
