[project]
name = "aws-scanner"
version = "0.1.0"
description = "AWS Cloud Security Scanner for Misconfigurations (CSSM)"
dependencies = [
    "boto3>=1.39.3",
    "botocore>=1.39.3",
    "Jinja2>=3.1.6",
    "python-dotenv>=1.1.1",
    "MarkupSafe>=3.0.2",
    "packaging>=25.0",
    "cfn-flip>=1.3.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "iniconfig>=2.1.0",
    "pluggy>=1.6.0"
]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aws-scanner = "aws_scanner.cli.main:main"